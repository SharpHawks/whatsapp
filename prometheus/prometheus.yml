global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'whatsapp-api'
    static_configs:
      - targets: ['api-server:3000']
    metrics_path: /metrics

  - job_name: 'whatsapp-worker'
    static_configs:
      - targets: ['message-worker:3001']
    metrics_path: /metrics
