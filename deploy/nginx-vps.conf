# Optional: Nginx on the host when the frontend is NOT published on :80 in docker-compose
# (if compose maps frontend "80:80", you do not need this file — use CORS for http://YOUR_IP only).
# Example when frontend is on 127.0.0.1:8081: set proxy_pass to http://127.0.0.1:8081
# The app container’s nginx still proxies /api/ and /socket.io/ to the API.
#
# Install (Debian/Ubuntu):
#   sudo cp deploy/nginx-vps.conf /etc/nginx/sites-available/whatsapp
#   sudo ln -sf /etc/nginx/sites-available/whatsapp /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace http://YOUR_SERVER_IP in your project .env:
#   CORS_ORIGINS=http://YOUR_SERVER_IP
#   docker compose up -d api-server

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # File uploads (media in WhatsApp API)
    client_max_body_size 25m;

    # Generous timeouts for WebSocket and long API calls
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}

